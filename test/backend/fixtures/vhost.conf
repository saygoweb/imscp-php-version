<VirtualHost *:80>
    ServerAdmin webmaster@h0005.hosting.saygoweb.com
    ServerName h0005.hosting.saygoweb.com
    ServerAlias www.h0005.hosting.saygoweb.com
    DocumentRoot "/var/www/virtual/h0005.hosting.saygoweb.com/htdocs"
    DirectoryIndex disabled
    LogLevel error
    ErrorLog "/var/log/apache2/h0005.hosting.saygoweb.com/error.log"
    Alias "/errors/" "/var/www/virtual/h0005.hosting.saygoweb.com/errors/"
    <Proxy "unix:/run/php/php7.3-fpm-h0005.hosting.saygoweb.com.sock|fcgi://h0005.hosting.saygoweb.com" retry=0>
        ProxySet connectiontimeout=5 timeout=7200
    </Proxy>
    <Directory "/var/www/virtual/h0005.hosting.saygoweb.com/htdocs">
        Options FollowSymLinks
        DirectoryIndex index.php
        AllowOverride All
        <If "%{REQUEST_FILENAME} =~ /\.ph(?:p[3457]?|t|tml)$/ && -f %{REQUEST_FILENAME}">
            SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
            SetHandler proxy:fcgi://h0005.hosting.saygoweb.com
        </If>
        DirectoryIndex index.html index.xhtml index.htm
        Require all granted
    </Directory>
    Include "/etc/apache2/imscp/h0005.hosting.saygoweb.com.conf"
</VirtualHost>
