[h0005.hosting.saygoweb.com]
user = vu620243
group = vu620243
listen = /run/php/php7.3-fpm-h0005.hosting.saygoweb.com.sock
listen.owner = vu620243
listen.group = vu620243
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.process_idle_timeout = 60s
pm.max_requests = 1000
chdir = /
security.limit_extensions = .php .php3 .php4 .php5 .php7 .pht .phtml
env[TMPDIR] = /var/www/virtual/h0005.hosting.saygoweb.com/phptmp
php_admin_value[open_basedir] = "/var/www/virtual/h0005.hosting.saygoweb.com/:/usr/share/php/:/dev/random:/dev/urandom"
php_admin_value[upload_tmp_dir] = /var/www/virtual/h0005.hosting.saygoweb.com/phptmp
php_admin_value[session.save_path] = /var/www/virtual/h0005.hosting.saygoweb.com/phptmp
php_admin_value[soap.wsdl_cache_dir] = /var/www/virtual/h0005.hosting.saygoweb.com/phptmp
php_admin_value[sendmail_path] = /usr/sbin/sendmail -t -i -f webmaster@h0005.hosting.saygoweb.com
php_admin_value[max_execution_time] = 30
php_admin_value[max_input_time] = 60
php_admin_value[memory_limit] = 128M
php_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT
php_flag[display_errors] = off
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 2M
php_admin_flag[allow_url_fopen] = off
php_admin_value[disable_functions] = exec,passthru,phpinfo,popen,proc_open,show_source,shell,shell_exec,symlink,system,mail
